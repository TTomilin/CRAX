[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crax"
version = "0.0.1"
description = "A GPU-accelerated benchmark and algorithm suite for Safe RL."
authors = [
    { name = "CRAX Authors" },
]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "JAX",
    "reinforcement learning",
    "safe reinforcement learning",
    "constrained reinforcement learning",
    "rigidbody",
    "physics",
]
dependencies = [
    "absl-py",
    "etils",
    "flask",
    "flask_cors",
    "flax",
    "jax>=0.4.6",
    "jaxlib>=0.4.6",
    "jaxopt",
    "jinja2",
    "ml_collections",
    "mujoco==3.3.2",
    "mujoco-mjx==3.3.2",
    "numpy",
    "optax",
    "orbax-checkpoint",
    "pandas",
    "Pillow",
    "scipy",
    "tensorboardX",
    "trimesh",
    "typing-extensions",
    "wandb",
    "imageio[ffmpeg]",
    "matplotlib",
]

[project.optional-dependencies]
develop = [
    "pytest",
    "gym",
    "dm_env",
]
cuda = [
    "jax[cuda12]>=0.4.6",
]

[tool.isort]
force_single_line = true
force_sort_within_sections = true
lexicographical = true
single_line_exclusions = ["typing"]
order_by_type = false
group_by_package = true
line_length = 120
use_parentheses = true
multi_line_output = 3
skip_glob = ["**/*.ipynb"]

[tool.pyink]
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
extend-exclude = '''(
 .ipynb$
)'''
