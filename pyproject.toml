[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crax"
version = "0.1.0"
description = "A GPU-accelerated benchmark and algorithm suite for Safe RL."
authors = [
    { name = "CRAX Authors" },
]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "JAX",
    "reinforcement learning",
    "safe reinforcement learning",
    "constrained reinforcement learning",
    "rigidbody",
    "physics",
]
# Core dependencies: everything needed to build, step and render an
# environment. Deliberately kept lean so `import crax` stays cheap; the
# training stack lives in the `train` extra.
dependencies = [
    "absl-py",
    "etils",
    "flax",
    "jax>=0.4.6",
    "jaxlib>=0.4.6",
    "jaxopt",
    "ml_collections",
    "mujoco==3.11.0",
    "mujoco-mjx==3.11.0",
    "mujoco-warp==3.11.0",
    "warp-lang==1.16.0",
    "numpy",
    "Pillow",
    "typing-extensions",
]

[project.optional-dependencies]
# The `training` package: RL algorithms, networks, checkpointing, logging.
train = [
    "optax",
    "orbax-checkpoint",
    "wandb",
    "imageio[ffmpeg]",
    "matplotlib",
]
# Downloading and plotting benchmark results (`results/`).
analysis = [
    "pandas",
    "matplotlib",
    "wandb",
]
# Third-party API wrappers in `crax.envs.wrappers`.
gym = [
    "gym>=0.26.0",
    "dm_env",
]
torch = [
    "torch",
]
cuda = [
    "jax[cuda12]>=0.4.6",
]
develop = [
    "crax[train,analysis,gym]",
    "pytest",
]
# Everything except the CUDA and torch stacks.
all = [
    "crax[train,analysis,gym]",
]

[project.scripts]
crax-train = "training.train_env:main"
crax-train-curriculum = "training.train_curriculum:main"
crax-train-transfer = "training.train_transfer:main"

[tool.hatch.build.targets.wheel]
packages = ["crax", "training"]

[tool.isort]
force_single_line = true
force_sort_within_sections = true
lexicographical = true
single_line_exclusions = ["typing"]
order_by_type = false
group_by_package = true
line_length = 120
use_parentheses = true
multi_line_output = 3
skip_glob = ["**/*.ipynb"]

[tool.pyink]
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
extend-exclude = '''(
 .ipynb$
)'''
